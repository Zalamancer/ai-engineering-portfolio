[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ihsan Duru", email = "duruihsan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
    "mlx-lm; sys_platform == 'darwin'",
    "numpy>=2.5.3",
    "openai>=3.11.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
hybrid-rag = "hybrid_rag:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
