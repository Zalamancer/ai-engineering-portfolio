name: prompt-regression
# Runs on every PR that touches a prompt (guide Phase 5.1). Two layers:
#  1. always: tests + prompt/dataset validation (no model needed)
#  2. if model access is configured as repository secrets (LLM_BASE_URL / LLM_API_KEY / LLM_MODEL):
#     run the eval against the stored baseline, upload the HTML report, comment on the PR, and
#     fail the job on a critical regression so branch protection can block the merge.
# Without those secrets the eval step is skipped and the PR comment says so — a missing model is
# never reported as a pass.
on:
  pull_request:
    paths: ["02-model-regression/prompts/**", "02-model-regression/regress/**", "02-model-regression/data/golden/**"]
  workflow_dispatch:
defaults:
  run:
    working-directory: 02-model-regression
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:   # secrets cannot be used in `if:` directly; map them to env first
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Unit tests + config validation
        run: |
          uv run pytest -q
          uv run regress dataset-stats
      - name: Evaluate changed prompts against the baseline
        id: eval
        if: env.LLM_BASE_URL != ''
        env:
          REG_LLM_BASE_URL: ${{ env.LLM_BASE_URL }}
          REG_LLM_API_KEY: ${{ env.LLM_API_KEY }}
          REG_LLM_MODEL: ${{ env.LLM_MODEL }}
          REG_SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        run: |
          set -o pipefail
          # runs/ (baseline + history) is committed so the comparison has something to compare against
          for p in $(git diff --name-only origin/${{ github.base_ref }}... -- prompts/ | sed 's#02-model-regression/##'); do
            echo "## $p" >> summary.md
            uv run regress run --prompt "$p" --gate ${SLACK_SEND:+--send} 2>&1 | tee -a summary.md || echo "GATE_FAILED=1" >> "$GITHUB_ENV"
          done
      - name: Upload HTML reports
        if: always() && env.LLM_BASE_URL != ''
        uses: actions/upload-artifact@v4
        with: { name: regression-reports, path: 02-model-regression/reports/*.html }
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '02-model-regression/summary.md';
            const body = fs.existsSync(path)
              ? '### Prompt regression check\n```\n' + fs.readFileSync(path, 'utf8').slice(-6000) + '\n```\n' + (process.env.GATE_FAILED ? '🚨 **critical regression — merge blocked**' : '✅ no critical regression')
              : '### Prompt regression check\n⚠️ Model access secrets (LLM_BASE_URL/LLM_API_KEY/LLM_MODEL) are not configured, so the evaluation was **skipped**. Tests and config validation passed. This is not a pass of the regression gate.';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: Fail on critical regression
        if: env.GATE_FAILED == '1'
        run: exit 2
